# Netlify build settings. Netlify reads this automatically, so the site can be
# created by linking the repository without filling anything in by hand.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path must serve index.html so a refresh on any URL
# does not 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
