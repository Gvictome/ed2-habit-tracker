<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, system-ui, sans-serif; background: #020617; }
    a { color: #00d492; } a:hover { color: #5ee9b5; }
    .num { font-family: 'Space Grotesk', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 900px; min-height: 560px; background: #020617; color: #f1f5f9;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 40px; border-bottom: 1px solid #1d293d; background: rgba(15,23,43,0.4);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: #00bc7d;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#002c22" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </span>
      <span class="num" style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em;">Streakly</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="font-size: 13px; color: #62748e;">gio@streakly.app</span>
      <button style="font-family: inherit; font-size: 13px; font-weight: 500; color: #cad5e2; background: transparent; border: 1px solid #314158; border-radius: 9px; padding: 6px 12px; cursor: pointer;">Log out</button>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 26px; padding: 32px 40px 40px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #00d492;">Today</span>
      <h1 class="num" style="margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -0.02em; color: #ffffff;">Friday, September 11</h1>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 56px 40px; border: 1px dashed #314158; border-radius: 20px;">
      <div style="display: flex; gap: 8px; margin-bottom: 14px;">
        <span style="width: 34px; height: 34px; border-radius: 10px; border: 1px solid #1d293d;"></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; border: 1px solid #1d293d;"></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; background: rgba(0,188,125,0.25);"></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; background: rgba(0,188,125,0.55);"></span>
        <span style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: #00bc7d;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#002c22" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      </div>
      <h2 class="num" style="margin: 0; font-size: 21px; font-weight: 700; color: #ffffff;">Start your first streak</h2>
      <p style="margin: 0; max-width: 340px; text-align: center; font-size: 14px; line-height: 1.5; color: #90a1b9;">Pick one thing you want to do consistently. Check it off today and the streak starts counting.</p>
      <button style="font-family: inherit; margin-top: 16px; padding: 11px 20px; border: none; border-radius: 11px; background: #00bc7d; font-size: 14px; font-weight: 700; color: #002c22; cursor: pointer;">Add a habit</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
